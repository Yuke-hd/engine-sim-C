name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-package:
    name: Swift package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Initialize solver submodule
        run: git submodule update --init dependencies/submodules/simple-2d-constraint-solver

      - name: Build package
        run: swift build -c release

      - name: Check Release force guard
        run: bash swift/Tests/check_force_guard.sh

      - name: Test package
        run: swift test -c release
