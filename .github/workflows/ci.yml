name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-package:
    name: Swift package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Swift on Linux
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Initialize solver submodule
        run: git submodule update --init dependencies/submodules/simple-2d-constraint-solver

      - name: Build package
        run: swift build -c release -Xcxx -include -Xcxx math.h

      - name: Test package
        run: swift test -c release -Xcxx -include -Xcxx math.h
